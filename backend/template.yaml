    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-browseList"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: browseList.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /browse/{mountPath}
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
