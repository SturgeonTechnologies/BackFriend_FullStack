          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: DELETE
            Path: /admin/invites/{email}
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/admin/revokeInvite.ts

  ListAccess:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "schuit-sharing-${Stage}-listAccess"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: listAccess.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /admin/access
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/admin/listAccess.ts

  # =========================================================================
  # Admin: mounts
  # =========================================================================
  CreateMount:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "schuit-sharing-${Stage}-createMount"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: createMount.handler
