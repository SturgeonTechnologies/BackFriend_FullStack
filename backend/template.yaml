            ApiId: !Ref HttpApi
            Method: DELETE
            Path: /admin/explore/directory
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
