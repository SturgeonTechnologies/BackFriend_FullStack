          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /admin/explore/public
            Auth: { Authorizer: CognitoJwt }
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: DELETE
            Path: /admin/explore/public
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/admin/explorePublic.ts

  # =========================================================================
  # Admin: per-file public sharing (mount-relative)
  # =========================================================================
  SetPublic:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "schuit-sharing-${Stage}-setPublic"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: setPublic.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /browse/{mountPath}/public
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
