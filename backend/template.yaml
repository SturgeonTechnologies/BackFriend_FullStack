            Path: /search
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/user/search.ts

  BrowseList:
