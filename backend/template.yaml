AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  schuit-sharing backend (AWS SAM). Faithful translation of the Serverless
  Framework v3 serverless.yml. Resource NAMES (tables, user pool, Lambda
  functions) and stack OUTPUTS are preserved exactly.

  Two modes (see the ExistingUserPoolId parameter):
    - CREATE (default): creates the full data plane — used by samtest and forkers.
    - ADOPT (prod cutover): references an existing Cognito pool + DynamoDB tables
      by id/name instead of creating them, so prod can move to SAM without
      touching live users/data. The old pool/tables are retained + orphaned from
      the Serverless stack rather than imported. See SAM.md "Prod cutover".

# ---------------------------------------------------------------------------
# Parameters
#   Per-stage values that were `custom.*` in serverless.yml. Secrets (the OAuth
#   client secrets) are NoEcho and are passed at deploy time from SSM by the
#   deploy wrapper — CFN cannot resolve an `ssm-secure` dynamic reference inside
#   a Cognito IdP's ProviderDetails (that's gotcha #1 from the assessment).
# ---------------------------------------------------------------------------
Parameters:
  Stage:
    Type: String
    Default: samtest
    Description: Deployment stage; drives all resource names (schuit-sharing-<stage>-*).

  SharesBucket:
    Type: String
    Description: Name of the (external, not managed here) S3 bucket that mounts read/write.

  SiteOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Public site origin used when building public share links / redirects.

  AppDisplayName:
    Type: String
    Default: Sharing App
    Description: Friendly name returned by GET /config, shown by clients (e.g. mobile) when adding this backend as an account.

  CognitoCustomDomain:
    Type: String
    Default: ""
    Description: >
      Optional Cognito custom domain (e.g. auth.schuit.io) already created +
      DNS-aliased outside this template (see SAM.md). When set, GET /config
      returns this instead of the auto-generated schuit-sharing-<stage>-<acct>
      amazoncognito.com domain. Leave blank (default) for stages without one.

  AllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:5173
    Description: CORS allowed origins for the HTTP API.

  BootstrapAdminEmails:
    Type: String
    Default: riley.schuit@gmail.com
    Description: Comma-separated emails auto-promoted to admins on first sign-in.

  MailFrom:
    Type: String
    Default: noreply@schuit.io
    Description: SES verified From address for invite emails.

  MailRegion:
    Type: String
    Default: us-east-1
    Description: Region of the shared SES identity (schuit.io).

  GoogleClientId:
    Type: String
    Default: ""
    Description: Google OAuth client id (public).

  GoogleClientSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Google OAuth client secret (from SSM SecureString, passed at deploy time).

  FacebookClientId:
    Type: String
    Default: ""
    Description: Facebook App id.

  FacebookClientSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Facebook App secret (from SSM SecureString, passed at deploy time).

  WebCallbackUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:5173/auth/callback,https://sharing.schuit.io/auth/callback"
    Description: OAuth callback URLs for the web SPA client.

  WebLogoutUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:5173/,https://sharing.schuit.io/"
    Description: OAuth sign-out URLs for the web SPA client.

  MobileCallbackUrls:
    Type: CommaDelimitedList
    Default: "backfriend://auth/callback"
    Description: OAuth callback URLs for the mobile (Expo) PKCE client (working scheme; app name TBD).

  MobileLogoutUrls:
    Type: CommaDelimitedList
    Default: "backfriend://signout"
    Description: OAuth sign-out URLs for the mobile (Expo) PKCE client.

  # ── Adopt mode (prod cutover) ─────────────────────────────────────────────
  # When ExistingUserPoolId is non-empty, the stack does NOT create the data
  # plane (pool, web client, IdPs, domain, admins group, tables); it references
  # the existing ones instead. Used to cut prod over to SAM without touching the
  # live pool/tables. Leave blank (default) for a fresh/create deploy (samtest,
  # forkers). See SAM.md.
  ExistingUserPoolId:
    Type: String
    Default: ""
    Description: Adopt mode — id of an existing Cognito user pool to reference. Blank = create one.

  ExistingWebClientId:
    Type: String
    Default: ""
    Description: Adopt mode — id of the existing web app client (goes in the JWT authorizer audience).

  MobileIdentityProviders:
    Type: CommaDelimitedList
    Default: "COGNITO,Google,Facebook"
    Description: >
      Adopt mode only — the identity providers the ADOPTED pool already has, applied
      to the mobile client (the prod pool has all three). Set to just "COGNITO" if
      adopting a pool without federated IdPs. Ignored in create mode.

  FunctionNamePrefix:
    Type: String
    Default: schuit-sharing
    Description: >
      Prefix for Lambda function + role names (set per-env in samconfig.toml:
      "schuit-sharing-samtest", "schuit-sharing-prod-sam"). In adopt mode this MUST
      differ from the still-live Serverless stack's names (schuit-sharing-prod-*).

Conditions:
  # Create the data plane (pool, web client, IdPs, domain, group, tables) unless
  # adopting an existing one (prod cutover). See the ExistingUserPoolId param.
  CreateDataPlane: !Equals [!Ref ExistingUserPoolId, ""]
  # Only create the federated IdPs (and list them on the clients) when creds are
  # supplied AND we're creating the data plane. Lets the test stage come up green
  # with just email/password; in adopt mode the IdPs already exist on the pool.
  HasGoogle: !Not [!Equals [!Ref GoogleClientId, ""]]
  HasFacebook: !Not [!Equals [!Ref FacebookClientId, ""]]
  CreateGoogle: !And [!Condition CreateDataPlane, !Condition HasGoogle]
  CreateFacebook: !And [!Condition CreateDataPlane, !Condition HasFacebook]
  HasCognitoCustomDomain: !Not [!Equals [!Ref CognitoCustomDomain, ""]]

# ---------------------------------------------------------------------------
# Globals — shared Function config (was provider.* in serverless.yml)
# ---------------------------------------------------------------------------
Globals:
  Function:
    # nodejs24.x: nodejs20.x is deprecated (2026-04-30). Handlers are esbuild-
    # bundled TS, so bumping the runtime is safe; esbuild Target stays node20.
    Runtime: nodejs24.x
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        STAGE: !Ref Stage
        # In adopt mode the tables aren't created here; reference them by their
        # (stage-derived) real names, which this template reproduces exactly.
        INVITES_TABLE: !If [CreateDataPlane, !Ref InvitesTable, !Sub "schuit-sharing-${Stage}-invites"]
        MOUNTS_TABLE: !If [CreateDataPlane, !Ref MountsTable, !Sub "schuit-sharing-${Stage}-mounts"]
        PUBLIC_SHARES_TABLE: !If [CreateDataPlane, !Ref PublicSharesTable, !Sub "schuit-sharing-${Stage}-public-shares"]
        # USER_POOL_ID intentionally NOT injected (would create a circular dep
        # via UserPool.LambdaConfig -> trigger Lambdas). See serverless.yml notes.
        ADMIN_GROUP: admins
        BOOTSTRAP_ADMIN_EMAILS: !Ref BootstrapAdminEmails
        SHARES_BUCKET: !Ref SharesBucket
        SITE_ORIGIN: !Ref SiteOrigin
        MAIL_FROM: !Ref MailFrom
        MAIL_REGION: !Ref MailRegion

Resources:
  # =========================================================================
  # Shared IAM role (serverless used a single role for all functions; SAM
  # defaults to per-function roles, so we define it explicitly and reference it
  # from Globals.Function.Role above).
  # =========================================================================
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${FunctionNamePrefix}-lambda"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # DynamoDB: invites + mounts + public shares (+ its GSI)
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                # Adopt mode: build the ARNs from the (stage-derived) real table
                # names since the table resources aren't created in this stack.
                Resource: !If
                  - CreateDataPlane
                  - - !GetAtt InvitesTable.Arn
                    - !GetAtt MountsTable.Arn
                    - !GetAtt PublicSharesTable.Arn
                    - !Sub "${PublicSharesTable.Arn}/index/*"
                  - - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/schuit-sharing-${Stage}-invites"
                    - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/schuit-sharing-${Stage}-mounts"
                    - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/schuit-sharing-${Stage}-public-shares"
                    - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/schuit-sharing-${Stage}-public-shares/index/*"
              # S3: list the shared bucket
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${SharesBucket}"
              # S3: object get/put/delete within the shared bucket
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub "arn:aws:s3:::${SharesBucket}/*"
              # Cognito admin APIs (wildcard userpool ARN — using the pool ARN
              # would recreate the circular dependency; see serverless.yml).
              - Effect: Allow
                Action:
                  - cognito-idp:AdminAddUserToGroup
                  - cognito-idp:AdminRemoveUserFromGroup
                  - cognito-idp:AdminListGroupsForUser
                  - cognito-idp:AdminGetUser
                  - cognito-idp:ListUsers
                  - cognito-idp:ListUsersInGroup
                Resource:
                  - !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"
              # SES: send invite emails (identity owned by the email-infra stack)
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource:
                  - !Sub "arn:aws:ses:${MailRegion}:${AWS::AccountId}:identity/*"

  # =========================================================================
  # HTTP API (was provider.httpApi). Cognito JWT authorizer + CORS.
  # =========================================================================
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # StageName omitted -> "$default" (auto-deploy), matching serverless.
      FailOnWarnings: true
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
      Auth:
        # No DefaultAuthorizer: the /public/{token} route is intentionally open.
        Authorizers:
          CognitoJwt:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !If
                - CreateDataPlane
                - !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
                - !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${ExistingUserPoolId}"
              audience:
                # Existing web client (adopt) or the created one, plus the mobile client.
                - !If [CreateDataPlane, !Ref UserPoolClient, !Ref ExistingWebClientId]
                - !Ref UserPoolClientMobile

  # =========================================================================
  # Cognito trigger Lambdas (wired to the pool POST-deploy by
  # scripts/wire-cognito-triggers.mjs — names must be exactly
  # schuit-sharing-<stage>-{preSignUp,postAuth,preTokenGen}).
  # =========================================================================
  PreSignUp:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-preSignUp"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: preSignUp.handler
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/triggers/preSignUp.ts

  PostAuth:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-postAuth"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: postAuth.handler
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/triggers/postAuth.ts

  PreTokenGen:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-preTokenGen"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: preTokenGen.handler
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/triggers/preTokenGen.ts

  PreSignUpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PreSignUp.Arn
      Principal: cognito-idp.amazonaws.com
      # Adopt mode: the existing pool (by id) must be allowed to invoke the trigger.
      SourceArn: !If
        - CreateDataPlane
        - !GetAtt UserPool.Arn
        - !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${ExistingUserPoolId}"

  PostAuthInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PostAuth.Arn
      Principal: cognito-idp.amazonaws.com
      # Adopt mode: the existing pool (by id) must be allowed to invoke the trigger.
      SourceArn: !If
        - CreateDataPlane
        - !GetAtt UserPool.Arn
        - !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${ExistingUserPoolId}"

  PreTokenGenInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PreTokenGen.Arn
      Principal: cognito-idp.amazonaws.com
      # Adopt mode: the existing pool (by id) must be allowed to invoke the trigger.
      SourceArn: !If
        - CreateDataPlane
        - !GetAtt UserPool.Arn
        - !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${ExistingUserPoolId}"

  # =========================================================================
  # Admin: invites
  # =========================================================================
  CreateInvite:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-createInvite"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: createInvite.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /admin/invites
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/admin/createInvite.ts

  ListInvites:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-listInvites"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: listInvites.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /admin/invites
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/admin/listInvites.ts

  RevokeInvite:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-revokeInvite"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: revokeInvite.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: DELETE
            Path: /admin/invites/{email}
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/admin/revokeInvite.ts

  ListAccess:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-listAccess"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: listAccess.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /admin/access
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/admin/listAccess.ts

  # =========================================================================
  # Admin: mounts
  # =========================================================================
  CreateMount:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-createMount"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: createMount.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /admin/mounts
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/admin/createMount.ts

  UpdateMount:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-updateMount"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: updateMount.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PUT
            Path: /admin/mounts/{mountPath}
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/admin/updateMount.ts

  DeleteMount:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-deleteMount"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: deleteMount.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: DELETE
            Path: /admin/mounts/{mountPath}
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/admin/deleteMount.ts

  # =========================================================================
  # Admin: raw-bucket explorer
  # =========================================================================
  ExploreBucket:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-exploreBucket"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: exploreBucket.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /admin/explore
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/admin/exploreBucket.ts

  CreateFolder:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-createFolder"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: createFolder.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /admin/explore/folder
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/admin/createFolder.ts

  DeleteDirectory:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-deleteDirectory"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: deleteDirectory.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: DELETE
            Path: /admin/explore/directory
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/admin/deleteDirectory.ts

  ExploreDownloadUrl:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-exploreDownloadUrl"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: exploreDownloadUrl.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /admin/explore/download-url
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/admin/exploreDownloadUrl.ts

  ExploreDeleteFile:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-exploreDeleteFile"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: exploreDeleteFile.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: DELETE
            Path: /admin/explore/file
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/admin/exploreDeleteFile.ts

  ExplorePublic:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-explorePublic"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: explorePublic.handler
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /admin/explore/public
            Auth: { Authorizer: CognitoJwt }
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: DELETE
            Path: /admin/explore/public
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/admin/explorePublic.ts

  # =========================================================================
  # Admin: per-file public sharing (mount-relative)
  # =========================================================================
  SetPublic:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-setPublic"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: setPublic.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /browse/{mountPath}/public
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/admin/setPublic.ts

  UnsetPublic:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-unsetPublic"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: unsetPublic.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: DELETE
            Path: /browse/{mountPath}/public
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/admin/unsetPublic.ts

  # =========================================================================
  # Public: backend discovery (NO authorizer). Lets a client (e.g. the mobile
  # app's "add account" flow) learn the Cognito Hosted UI endpoint + PKCE
  # client id from just the API base URL, instead of requiring manual entry.
  # =========================================================================
  GetConfig:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-getConfig"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: getConfig.handler
      Environment:
        Variables:
          APP_DISPLAY_NAME: !Ref AppDisplayName
          COGNITO_DOMAIN: !If
            - HasCognitoCustomDomain
            - !Sub "https://${CognitoCustomDomain}"
            - !Sub "https://schuit-sharing-${Stage}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
          COGNITO_CLIENT_ID: !Ref UserPoolClientMobile
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /config
            # No Auth block -> unauthenticated (needed before the client has signed in).
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/public/getConfig.ts

  # =========================================================================
  # Public: resolve a share token (NO authorizer)
  # =========================================================================
  ResolvePublic:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-resolvePublic"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: resolvePublic.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /public/{token}
            # No Auth block -> unauthenticated (public share resolution).
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/public/resolvePublic.ts

  # =========================================================================
  # Authenticated: directory browser
  # =========================================================================
  ListMounts:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-listMounts"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: listMounts.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /mounts
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/user/listMounts.ts

  Search:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-search"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: search.handler
