  ExplorePublic:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "schuit-sharing-${Stage}-explorePublic"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: explorePublic.handler
