  # =========================================================================
  # Cognito (raw CloudFormation, copied ~1:1 from serverless.yml)
  # =========================================================================
  UserPool:
    Type: AWS::Cognito::UserPool
    Condition: CreateDataPlane
    # NOTE: LambdaConfig intentionally absent — wired post-deploy by
    # scripts/wire-cognito-triggers.mjs to avoid the CFN circular dependency.
    Properties:
      UserPoolName: !Sub "schuit-sharing-${Stage}"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: "OFF"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: CreateGoogle
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "profile email openid"
      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name

  FacebookIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: CreateFacebook
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Facebook
      ProviderType: Facebook
      ProviderDetails:
        client_id: !Ref FacebookClientId
        client_secret: !Ref FacebookClientSecret
        authorize_scopes: "public_profile,email"
        api_version: v21.0
      AttributeMapping:
        email: email
        name: name

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: CreateDataPlane
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub "schuit-sharing-${Stage}-${AWS::AccountId}"

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: CreateDataPlane
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "schuit-sharing-${Stage}-web"
      GenerateSecret: false
      # !Ref to the IdP resources gives lint-clean conditional membership AND the
      # implicit create-ordering dependency (client after its IdPs).
      SupportedIdentityProviders: !If
        - CreateGoogle
        - !If
          - CreateFacebook
          - [COGNITO, !Ref GoogleIdentityProvider, !Ref FacebookIdentityProvider]
          - [COGNITO, !Ref GoogleIdentityProvider]
        - !If
          - CreateFacebook
          - [COGNITO, !Ref FacebookIdentityProvider]
          - [COGNITO]
      AllowedOAuthFlows: [code]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: !Ref WebCallbackUrls
      LogoutURLs: !Ref WebLogoutUrls
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH

  # Mobile (Expo) PKCE client — public, custom-scheme redirect. Added for the
  # mobile POC; same OAuth code+PKCE flow as web. Always created — attaches to the
  # created pool (create mode) or the adopted existing pool (adopt mode).
  UserPoolClientMobile:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !If [CreateDataPlane, !Ref UserPool, !Ref ExistingUserPoolId]
      ClientName: !Sub "schuit-sharing-${Stage}-mobile"
      GenerateSecret: false
      SupportedIdentityProviders: !If
        - CreateDataPlane
        # Create mode: mirror the web client (!Ref IdPs for ordering).
        - !If
          - CreateGoogle
          - !If
            - CreateFacebook
            - [COGNITO, !Ref GoogleIdentityProvider, !Ref FacebookIdentityProvider]
            - [COGNITO, !Ref GoogleIdentityProvider]
          - !If
            - CreateFacebook
            - [COGNITO, !Ref FacebookIdentityProvider]
            - [COGNITO]
        # Adopt mode: providers the existing pool already has (param).
        - !Ref MobileIdentityProviders
      AllowedOAuthFlows: [code]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: !Ref MobileCallbackUrls
      LogoutURLs: !Ref MobileLogoutUrls
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH

  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: CreateDataPlane
    Properties:
      GroupName: admins
      UserPoolId: !Ref UserPool
      Description: Administrators who can send invites and manage mounts
      Precedence: 1

  # =========================================================================
  # DynamoDB (copied ~1:1 from serverless.yml)
  # =========================================================================
  InvitesTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateDataPlane
    Properties:
      TableName: !Sub "schuit-sharing-${Stage}-invites"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: email, AttributeType: S }
      KeySchema:
        - { AttributeName: email, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  MountsTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateDataPlane
    Properties:
      TableName: !Sub "schuit-sharing-${Stage}-mounts"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: mountPath, AttributeType: S }
      KeySchema:
        - { AttributeName: mountPath, KeyType: HASH }

  PublicSharesTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateDataPlane
    Properties:
      TableName: !Sub "schuit-sharing-${Stage}-public-shares"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: mountPath, AttributeType: S }
        - { AttributeName: path, AttributeType: S }
        - { AttributeName: token, AttributeType: S }
      KeySchema:
        - { AttributeName: mountPath, KeyType: HASH }
        - { AttributeName: path, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: TokenIndex
          KeySchema:
            - { AttributeName: token, KeyType: HASH }
          Projection:
            ProjectionType: ALL

# ---------------------------------------------------------------------------
# Outputs — same keys as serverless.yml (wire-cognito-triggers.mjs reads
# UserPoolId + UserPoolClientId; the SPA/mobile read the rest).
# ---------------------------------------------------------------------------
Outputs:
  UserPoolId:
    Value: !If [CreateDataPlane, !Ref UserPool, !Ref ExistingUserPoolId]
  UserPoolClientId:
    Value: !If [CreateDataPlane, !Ref UserPoolClient, !Ref ExistingWebClientId]
  UserPoolClientMobileId:
    Value: !Ref UserPoolClientMobile
  CognitoDomain:
    # Domain prefix is deterministic (schuit-sharing-<stage>-<acct>) in both modes,
    # unless a custom domain (e.g. auth.schuit.io) was set up outside this template
    # and passed via CognitoCustomDomain — see that parameter's description.
    Value: !If
      - HasCognitoCustomDomain
      - !Sub "https://${CognitoCustomDomain}"
      - !Sub "https://schuit-sharing-${Stage}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
  ApiEndpoint:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  HttpApiId:
    Value: !Ref HttpApi
