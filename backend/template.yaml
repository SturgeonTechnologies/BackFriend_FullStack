            ApiId: !Ref HttpApi
            Method: GET
            Path: /admin/invites
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/admin/listInvites.ts

  RevokeInvite:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "schuit-sharing-${Stage}-revokeInvite"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: revokeInvite.handler
      Events:
