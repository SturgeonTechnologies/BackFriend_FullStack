  BrowseDownloadUrl:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-browseDownloadUrl"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: browseDownloadUrl.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /browse/{mountPath}/download-url
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/user/browseDownloadUrl.ts

  UploadUrl:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${FunctionNamePrefix}-uploadUrl"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: uploadUrl.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /browse/{mountPath}/upload-url
            Auth: { Authorizer: CognitoJwt }
    Metadata:
