  DeleteFile:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "schuit-sharing-${Stage}-deleteFile"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: deleteFile.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: DELETE
            Path: /browse/{mountPath}/file
            Auth: { Authorizer: CognitoJwt }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/user/deleteFile.ts

  # =========================================================================
  # Cognito (raw CloudFormation, copied ~1:1 from serverless.yml)
  # =========================================================================
  UserPool:
    Type: AWS::Cognito::UserPool
    # NOTE: LambdaConfig intentionally absent — wired post-deploy by
    # scripts/wire-cognito-triggers.mjs to avoid the CFN circular dependency.
    Properties:
      UserPoolName: !Sub "schuit-sharing-${Stage}"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: "OFF"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "profile email openid"
      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name

  FacebookIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasFacebook
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Facebook
      ProviderType: Facebook
      ProviderDetails:
        client_id: !Ref FacebookClientId
        client_secret: !Ref FacebookClientSecret
        authorize_scopes: "public_profile,email"
        api_version: v21.0
      AttributeMapping:
        email: email
        name: name

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub "schuit-sharing-${Stage}-${AWS::AccountId}"

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    # Both federated providers must exist before the client can list them.
    # DependsOn is conditional-safe: CFN skips deps on non-created resources.
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "schuit-sharing-${Stage}-web"
      GenerateSecret: false
      SupportedIdentityProviders: !If
        - HasAnyIdp
        - !Split
          - ","
          - !Sub
            - "COGNITO${g}${f}"
            - g: !If [HasGoogle, ",Google", ""]
              f: !If [HasFacebook, ",Facebook", ""]
        - [COGNITO]
      AllowedOAuthFlows: [code]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: !Ref WebCallbackUrls
      LogoutURLs: !Ref WebLogoutUrls
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH

  # Mobile (Expo) PKCE client — public, custom-scheme redirect. Added for the
  # mobile POC; same OAuth code+PKCE flow as web.
  UserPoolClientMobile:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "schuit-sharing-${Stage}-mobile"
      GenerateSecret: false
      SupportedIdentityProviders: !If
        - HasAnyIdp
        - !Split
          - ","
          - !Sub
            - "COGNITO${g}${f}"
            - g: !If [HasGoogle, ",Google", ""]
              f: !If [HasFacebook, ",Facebook", ""]
        - [COGNITO]
      AllowedOAuthFlows: [code]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: !Ref MobileCallbackUrls
      LogoutURLs: !Ref MobileLogoutUrls
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH

  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admins
      UserPoolId: !Ref UserPool
      Description: Administrators who can send invites and manage mounts
      Precedence: 1

  # =========================================================================
  # DynamoDB (copied ~1:1 from serverless.yml)
  # =========================================================================
  InvitesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "schuit-sharing-${Stage}-invites"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: email, AttributeType: S }
      KeySchema:
        - { AttributeName: email, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  MountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "schuit-sharing-${Stage}-mounts"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: mountPath, AttributeType: S }
      KeySchema:
        - { AttributeName: mountPath, KeyType: HASH }

  PublicSharesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "schuit-sharing-${Stage}-public-shares"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: mountPath, AttributeType: S }
        - { AttributeName: path, AttributeType: S }
        - { AttributeName: token, AttributeType: S }
      KeySchema:
        - { AttributeName: mountPath, KeyType: HASH }
        - { AttributeName: path, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: TokenIndex
          KeySchema:
            - { AttributeName: token, KeyType: HASH }
          Projection:
            ProjectionType: ALL

# ---------------------------------------------------------------------------
# Outputs — same keys as serverless.yml (wire-cognito-triggers.mjs reads
# UserPoolId + UserPoolClientId; the SPA/mobile read the rest).
# ---------------------------------------------------------------------------
Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  UserPoolClientMobileId:
    Value: !Ref UserPoolClientMobile
  CognitoDomain:
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  ApiEndpoint:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  HttpApiId:
    Value: !Ref HttpApi
