  # =========================================================================
  # Public: resolve a share token (NO authorizer)
  # =========================================================================
  ResolvePublic:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "schuit-sharing-${Stage}-resolvePublic"
      CodeUri: .
      Role: !GetAtt LambdaRole.Arn
      Handler: resolvePublic.handler
      Events:
