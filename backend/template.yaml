          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /public/{token}
            # No Auth block -> unauthenticated (public share resolution).
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Sourcemap: true
        Target: node20
        EntryPoints:
          - src/handlers/public/resolvePublic.ts

  # =========================================================================
