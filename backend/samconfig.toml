# SAM CLI configuration. Secrets (OAuth client secrets) are intentionally NOT
# stored here — they are read from SSM SecureString and passed at deploy time by
# scripts/sam-deploy.mjs. See SAM.md.
#
# Region is us-east-1 for every stage: the SES identity, the Google/Facebook SSM
# params, and the wire-cognito-triggers.mjs default region are all us-east-1.
version = 0.1

# ===========================================================================
# samtest — isolated throwaway stage (its own fresh Cognito pool + tables).
# Comes up with email/password only (no OAuth creds passed -> IdPs skipped).
# Safe to deploy/delete freely; touches nothing prod.
# ===========================================================================
[samtest.global.parameters]
stack_name = "schuit-sharing-samtest"
region = "us-east-1"

[samtest.build.parameters]
cached = true
parallel = true

[samtest.deploy.parameters]
capabilities = "CAPABILITY_NAMED_IAM"
s3_bucket = "schuit-sharing-sam-artifacts-587449585882"
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = "Stage=samtest SharesBucket=schuit-sharing-samtest SiteOrigin=http://localhost:5173 FunctionNamePrefix=schuit-sharing-samtest"

# ===========================================================================
# prod — the LIVE environment (sharing.schuit.io), ADOPT mode. This is a NEW,
# PARALLEL stack (`schuit-sharing-prod-sam`) that references the existing Cognito
# pool + DynamoDB tables (created by the Serverless stack `schuit-sharing-prod`)
# instead of creating them. It only creates compute (Lambdas, HTTP API, role) +
# a new mobile client. Deploying it does NOT touch the live pool/tables.
#
# Function names are prefixed `schuit-sharing-prod-sam-*` so they do NOT collide
# with the still-live Serverless `schuit-sharing-prod-*` Lambdas.
#
# OAuth secrets (GoogleClientSecret/FacebookClientSecret) are NOT stored here —
# pass them at deploy time from SSM. See SAM.md "Prod cutover" for the full
# staged runbook and the exact deploy command.
# ===========================================================================
[prod.global.parameters]
stack_name = "schuit-sharing-prod-sam"
region = "us-east-1"

[prod.build.parameters]
cached = true
parallel = true

[prod.deploy.parameters]
capabilities = "CAPABILITY_NAMED_IAM"
s3_bucket = "schuit-sharing-sam-artifacts-587449585882"
confirm_changeset = true
fail_on_empty_changeset = false
parameter_overrides = "Stage=prod FunctionNamePrefix=schuit-sharing-prod-sam SharesBucket=schuit-sharing SiteOrigin=https://sharing.schuit.io AllowedOrigins=https://sharing.schuit.io ExistingUserPoolId=us-east-1_8Zf0FwRVl ExistingWebClientId=mai2ubk9ca9apj335bth8os2g MobileCallbackUrls=backfriend://auth/callback MobileLogoutUrls=backfriend://signout CognitoCustomDomain=auth.schuit.io"
