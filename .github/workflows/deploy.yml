name: Deploy to prod

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# OIDC needs id-token: write; contents: read to check out the repo.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # Matches the role created by infrastructure/github-oidc.yml, which is
  # named "<ResourcePrefix>-gha-deploy" by default (see that template's
  # ResourcePrefix/Stage/RoleName parameters). If you deployed the template
  # with different parameter overrides, or a different RoleName, update this
  # ARN to match.
  DEPLOY_ROLE_ARN: arn:aws:iam::587449585882:role/schuit-sharing-gha-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: aws-actions/setup-sam@v2

      # TEMPORARY debug step -- diagnosing a persistent "Not authorized to
      # perform sts:AssumeRoleWithWebIdentity" despite the trust policy's sub
      # condition matching what we expect. Prints the actual decoded claims
      # GitHub is issuing so we can compare against the IAM trust policy
      # exactly, instead of guessing. Remove once resolved.
      - name: Debug OIDC token claims
        run: |
          python3 -c "
          import base64, json, urllib.request, os
          req = urllib.request.Request(
              os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com',
              headers={'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']},
          )
          token = json.load(urllib.request.urlopen(req))['value']
          payload = token.split('.')[1]
          payload += '=' * (-len(payload) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(payload)), indent=2))
          "

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Backend install
        working-directory: backend
        run: npm ci

      # deploy.config.json is gitignored (account-specific -- see
      # deploy.config.example.json for the shape) and supplied here from a
      # repo secret so it never lands in the repo itself.
      - name: Write deploy config
        working-directory: backend
        run: echo '${{ secrets.DEPLOY_CONFIG_PROD }}' > deploy.config.json

      # One script: SAM build+deploy, Cognito trigger/theme/email wiring,
      # and the frontend build+S3 sync+CloudFront invalidation (it runs its
      # own `npm ci` for frontend/ when the config's "frontend" block is set).
      - name: Deploy backend + frontend
        working-directory: backend
        run: node scripts/deploy.mjs deploy.config.json
