# rileyschuit.com -> www.rileyschuit.com, keeping the path. Traefik answers from the
# middleware, so the backend below is never called; an Ingress just has to name one.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: apex-to-www
spec:
  redirectRegex:
    regex: ^https?://rileyschuit\.com/(.*)
    replacement: https://www.rileyschuit.com/${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apex-redirect
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: backfriend-bros-apex-to-www@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - rileyschuit.com
      secretName: rileyschuit-com-tls
  rules:
    - host: rileyschuit.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backfriend
                port: { number: 8080 }
