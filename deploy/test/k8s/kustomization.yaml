# deploy/kubernetes with test values: run-kubernetes.sh fills in NFS_SERVER.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: backfriend
resources:
  - ../../kubernetes
  - ../smtp
configMapGenerator:
  - name: backfriend-site
    behavior: merge
    literals:
      - SITE_HOST=sharing.test
      - SITE_ORIGIN=https://sharing.test
      - KC_HOSTNAME=https://sharing.test/idp
      - OIDC_ISSUER=https://sharing.test/idp/realms/backfriend
images:
  - name: ghcr.io/sturgeontechnologies/backfriend
    newName: backfriend
    newTag: e2e
# The host in the base was filled in when it was built, so set it again from the values above.
replacements:
  - source: { kind: ConfigMap, name: backfriend-site, fieldPath: data.SITE_HOST }
    targets:
      - select: { kind: Ingress, name: backfriend }
        fieldPaths: [spec.rules.0.host, spec.tls.0.hosts.0]
      - select: { kind: Ingress, name: backfriend-idp }
        fieldPaths: [spec.rules.0.host, spec.tls.0.hosts.0]
patches:
  - target: { kind: Deployment, name: backfriend }
    patch: |
      - { op: replace, path: /spec/template/spec/containers/0/imagePullPolicy, value: Never }
  - target: { kind: PersistentVolume, name: backfriend-data }
    patch: |
      - { op: replace, path: /spec/nfs/server, value: NFS_SERVER }
      - { op: replace, path: /spec/nfs/path, value: /srv/nfs/sharing_schuit_io/data }
  - target: { kind: PersistentVolume, name: backfriend-config }
    patch: |
      - { op: replace, path: /spec/nfs/server, value: NFS_SERVER }
      - { op: replace, path: /spec/nfs/path, value: /srv/nfs/sharing_schuit_io/config }
