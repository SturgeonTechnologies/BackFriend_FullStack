# Instead of gen-secret.sh, if you run External Secrets Operator: keep the same keys
# in your secret manager, add this file to kustomization.yaml, and set the store name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backfriend-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: backfriend-secrets
    creationPolicy: Owner
    # Losing FILE_SIGNING_KEY only breaks links in flight, but losing the database
    # passwords locks the services out of their data.
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: sturgeon/backfriend/backfriend-secrets
