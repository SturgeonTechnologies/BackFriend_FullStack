# Only if your cluster has no issuer yet. Needs cert-manager installed, and not part
# of kustomization.yaml because an issuer belongs to the whole cluster.
#   kubectl apply -f deploy/kubernetes/cert-manager/clusterissuer.yml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: you@example.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
