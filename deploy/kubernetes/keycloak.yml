# The identity provider. The app never sees a password. Its admin console isn't on the
# Ingress: reach it with `kubectl -n backfriend port-forward svc/keycloak 8081:8080`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels: { app: keycloak }
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.1
          args: [start, --import-realm]
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://postgres:5432/keycloak" }
            - { name: KC_DB_USERNAME, value: keycloak }
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: backfriend-secrets, key: KEYCLOAK_DB_PASSWORD } }
            - name: KC_HOSTNAME
              valueFrom: { configMapKeyRef: { name: backfriend-site, key: KC_HOSTNAME } }
            - { name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true" }
            - { name: KC_HOSTNAME_ADMIN, value: "http://localhost:8081/idp" }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_HTTP_RELATIVE_PATH, value: /idp }
            - { name: KC_HTTP_MANAGEMENT_RELATIVE_PATH, value: / }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: backfriend-secrets, key: KEYCLOAK_ADMIN_PASSWORD } }
            # Filled into realm-backfriend.json on first import.
            - name: SITE_ORIGIN
              valueFrom: { configMapKeyRef: { name: backfriend-site, key: SITE_ORIGIN } }
            - name: SMTP_HOST
              valueFrom: { secretKeyRef: { name: backfriend-secrets, key: SMTP_HOST } }
            - name: SMTP_PORT
              valueFrom: { secretKeyRef: { name: backfriend-secrets, key: SMTP_PORT } }
            - name: SMTP_FROM
              valueFrom: { secretKeyRef: { name: backfriend-secrets, key: SMTP_FROM } }
            - name: SMTP_AUTH
              valueFrom: { secretKeyRef: { name: backfriend-secrets, key: SMTP_AUTH } }
            - name: SMTP_USER
              valueFrom: { secretKeyRef: { name: backfriend-secrets, key: SMTP_USER } }
            - name: SMTP_PASSWORD
              valueFrom: { secretKeyRef: { name: backfriend-secrets, key: SMTP_PASSWORD } }
            - name: SMTP_STARTTLS
              valueFrom: { secretKeyRef: { name: backfriend-secrets, key: SMTP_STARTTLS } }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          startupProbe:
            httpGet: { path: /health/started, port: management }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: management }
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { cpu: 200m, memory: 768Mi }
            limits: { memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
            - { name: scripts, mountPath: /opt/keycloak/scripts, readOnly: true }
      volumes:
        - name: realm
          configMap: { name: keycloak-realm }
        - name: scripts
          configMap: { name: keycloak-scripts, defaultMode: 0555 }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: { app: keycloak }
  ports:
    - { name: http, port: 8080, targetPort: http }
