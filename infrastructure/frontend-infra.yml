AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CloudFront + ACM + Route53 for the SPA (apex domain). The API is otherwise
  NOT proxied here -- it has its own native API Gateway custom domain (see
  backend/template.yaml ApiCustomDomain + README "Custom domains") -- except
  for a single narrow /config passthrough (see ApiOriginDomain) so a client
  (e.g. the mobile app's "add a space" screen) can discover a backend from
  just the friendly apex URL, without needing to know the dedicated API
  subdomain. This stack owns SiteBucket's bucket policy (the OAC grant);
  manage it here, not out of band. Deploy in us-east-1 (CloudFront's ACM
  cert region requirement).

Parameters:
  DomainName:
    Type: String
    Description: The apex (or any) domain the SPA is served at, e.g. schuit.io.
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone ID that owns DomainName.
  SiteBucket:
    Type: String
    Description: Name of the *existing* S3 bucket that will host the SPA. Bucket must already exist.
  SitePrefix:
    Type: String
    Default: web
    Description: S3 key prefix under SiteBucket where the SPA lives. No leading or trailing slash.
  SiteBucketRegion:
    Type: String
    Default: us-east-1
    Description: Region where SiteBucket lives. Needed to build the correct S3 regional origin DNS name.
  ApiOriginDomain:
    Type: String
    Default: ""
    Description: >
      Optional. Hostname only (no scheme) of the backend's API -- either the
      raw `<id>.execute-api.<region>.amazonaws.com` (the backend stack's
      ApiEndpoint output, scheme stripped) or its ApiCustomDomain if one is
      set up. When set, this distribution proxies exactly one path -- GET
      /config -- to it, so typing just the apex domain into a client's "add
      backend" flow works without the client needing to know about (or a
      person needing to explain) a separate API subdomain. Leave blank to
      skip this entirely (no second origin, no extra cache behavior).

Conditions:
  HasApiOrigin: !Not [!Equals [!Ref ApiOriginDomain, ""]]

Resources:
  # ---------- TLS certificate ----------
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ---------- CloudFront distribution ----------
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases: [!Ref DomainName]
        DefaultRootObject: index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins: !If
          - HasApiOrigin
          - - Id: s3-site
              DomainName: !Sub "${SiteBucket}.s3.${SiteBucketRegion}.amazonaws.com"
              OriginPath: !Sub "/${SitePrefix}"
              S3OriginConfig:
                OriginAccessIdentity: ""
              OriginAccessControlId: !GetAtt OriginAccessControl.Id
            - Id: api-config
              DomainName: !Ref ApiOriginDomain
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
          - - Id: s3-site
              DomainName: !Sub "${SiteBucket}.s3.${SiteBucketRegion}.amazonaws.com"
              OriginPath: !Sub "/${SitePrefix}"
              S3OriginConfig:
                OriginAccessIdentity: ""
              OriginAccessControlId: !GetAtt OriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        # No global CustomErrorResponses. SPA fallback is handled in the
        # CloudFront Function below (only for non-asset paths), so a missing
        # /assets/foo.js correctly returns 404 instead of being silently
        # rewritten to index.html (which causes the browser to parse HTML as
        # JS and the app to fail to boot).
        CacheBehaviors: !If
          - HasApiOrigin
          # Exact-path passthroughs for backend discovery + public share
          # resolution (see ApiOriginDomain above) -- deliberately just these
          # two paths, not a general /api/* proxy, to stay out of the way of
          # the API's own dedicated subdomain.
          - - PathPattern: /config
              TargetOriginId: api-config
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD]
              CachedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled -- config is tiny and fetched once per add-account, not worth caching
            - PathPattern: /public/*
              TargetOriginId: api-config
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD]
              CachedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled -- each token resolves to a fresh presigned URL, never cache the redirect
          - !Ref "AWS::NoValue"

  # CloudFront Function (viewer-request): SPA fallback -- any request that has
  # no file extension (e.g. /admin, /browse/roms) is rewritten to /index.html
  # so React Router can handle it. Requests for files (anything containing a
  # "." in the last path segment, like /assets/index-abc.js or /favicon.ico)
  # pass through untouched, so a real missing asset surfaces as 404.
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for SPA routes
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          var uri = req.uri;

          // Apple's Universal Links verification file: no extension, so the
          // rule below would otherwise silently rewrite it to index.html and
          // break Universal Links (Apple fetches this exact path and expects
          // JSON, not HTML). It's a real file at frontend/public/.well-known/
          // apple-app-site-association -- just needs to bypass the rewrite.
          if (uri === '/.well-known/apple-app-site-association') {
            return req;
          }

          var lastSlash = uri.lastIndexOf('/');
          var lastSegment = uri.substring(lastSlash + 1);
          if (lastSegment.indexOf('.') === -1) {
            req.uri = '/index.html';
          }

          return req;
        }

  # ---------- Bucket policy (OAC) ----------
  # Scoped to just the /<SitePrefix>/* objects, so the distribution cannot
  # serve anything outside the SPA's prefix even if it's asked to.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACReadSPA
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${SiteBucket}/${SitePrefix}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ---------- DNS ----------
  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${DomainName}."
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's fixed hosted zone ID

Outputs:
  SiteBucketName:
    Value: !Ref SiteBucket
    Description: Existing S3 bucket that hosts the SPA.
  SitePrefix:
    Value: !Ref SitePrefix
    Description: Key prefix under SiteBucket where the SPA lives. Sync dist/ to s3://<SiteBucket>/<SitePrefix>/.
  SiteUploadPath:
    Value: !Sub "s3://${SiteBucket}/${SitePrefix}/"
    Description: Full S3 URI for `aws s3 sync dist/` target.
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  Url:
    Value: !Sub "https://${DomainName}"
