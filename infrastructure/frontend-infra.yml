AWSTemplateFormatVersion: "2010-09-09"
Description: |
  CloudFront distribution for sharing.schuit.io with:
    - Default behavior: static React SPA served from an *existing* S3 bucket
      (default: schuit-sharing, prefix: web/) via OAC
    - /api/* behavior: proxied to the API Gateway HTTP API created by the backend stack
    - Cert: ACM in us-east-1 (DNS-validated against the Route 53 hosted zone)
    - DNS: Route 53 A-alias record pointing sharing.schuit.io at the distribution

  The SPA is stored under s3://<SiteBucket>/<SitePrefix>/, e.g.
  s3://schuit-sharing/web/index.html. CloudFront's OriginPath prepends
  /<SitePrefix> so index.html requests hit the right S3 key.

  NOTE: this stack owns the `SiteBucket`'s bucket policy (the CloudFront OAC
  grant). If `schuit-sharing` needs other bucket-policy statements, add them
  to the `SiteBucketPolicy` resource here — managing that policy outside
  the stack will cause drift.

  Deploy this in us-east-1 so the ACM cert is in the required region for CloudFront.

Parameters:
  DomainName:
    Type: String
    Default: sharing.schuit.io
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone ID for schuit.io
  ApiGatewayDomain:
    Type: String
    Description: The execute-api domain printed by `serverless info` (e.g. xxxxxxxx.execute-api.us-east-1.amazonaws.com)
  SiteBucket:
    Type: String
    Default: schuit-sharing
    Description: Name of the *existing* S3 bucket that will host the SPA. Bucket must already exist.
  SitePrefix:
    Type: String
    Default: web
    Description: S3 key prefix under SiteBucket where the SPA lives. No leading or trailing slash.
  SiteBucketRegion:
    Type: String
    Default: us-east-1
    Description: Region where SiteBucket lives. Needed to build the correct S3 regional origin DNS name.

Resources:
  # ---------- TLS certificate ----------
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ---------- CloudFront distribution ----------
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases: [!Ref DomainName]
        DefaultRootObject: index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          # SPA origin: existing shared bucket, scoped to /<SitePrefix> via OriginPath.
          - Id: s3-site
            DomainName: !Sub "${SiteBucket}.s3.${SiteBucketRegion}.amazonaws.com"
            OriginPath: !Sub "/${SitePrefix}"
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
          - Id: api-gw
            DomainName: !Ref ApiGatewayDomain
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api-gw
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            # No caching for API responses.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            # Pass Authorization + CORS headers through.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
        # No global CustomErrorResponses. SPA fallback is handled in the
        # CloudFront Function below (only for non-asset paths), so a missing
        # /assets/foo.js correctly returns 404 instead of being silently
        # rewritten to index.html (which causes the browser to parse HTML as
        # JS and the app to fail to boot).

  # CloudFront Function (viewer-request) that handles two things:
  #   1. /api/* requests get the "/api" prefix stripped before being sent
  #      to the API Gateway origin.
  #   2. SPA fallback: any request that has no file extension (e.g. /admin,
  #      /browse/roms) is rewritten to /index.html so React Router can
  #      handle it. Requests for files (anything containing a "." in the
  #      last path segment, like /assets/index-abc.js or /favicon.ico)
  #      pass through untouched, so a real missing asset surfaces as 404.
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Strip /api prefix and serve index.html for SPA routes
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          var uri = req.uri;

          // 1) /api/* -> drop the "/api" prefix before forwarding to API Gateway.
          if (uri.indexOf('/api/') === 0) {
            req.uri = uri.substring(4);
            return req;
          }

          // 2) SPA fallback: if the last path segment has no ".", treat it
          //    as a virtual route and serve index.html. Real files (which
          //    always have an extension after Vite's hashed build, e.g.
          //    /assets/index-abc.js, /favicon.ico) fall through untouched.
          var lastSlash = uri.lastIndexOf('/');
          var lastSegment = uri.substring(lastSlash + 1);
          if (lastSegment.indexOf('.') === -1) {
            req.uri = '/index.html';
          }

          return req;
        }

  # ---------- Bucket policy (OAC) ----------
  # Scoped to just the /<SitePrefix>/* objects, so the distribution cannot
  # serve anything outside the SPA's prefix even if it's asked to.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACReadSPA
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${SiteBucket}/${SitePrefix}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ---------- DNS ----------
  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${DomainName}."
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's fixed hosted zone ID

Outputs:
  SiteBucketName:
    Value: !Ref SiteBucket
    Description: Existing S3 bucket that hosts the SPA.
  SitePrefix:
    Value: !Ref SitePrefix
    Description: Key prefix under SiteBucket where the SPA lives. Sync dist/ to s3://<SiteBucket>/<SitePrefix>/.
  SiteUploadPath:
    Value: !Sub "s3://${SiteBucket}/${SitePrefix}/"
    Description: Full S3 URI for `aws s3 sync dist/` target.
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  Url:
    Value: !Sub "https://${DomainName}"
