AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CloudFront + ACM + Route53 for the SPA (apex domain). API is NOT proxied
  here -- it has its own native API Gateway custom domain (see
  backend/template.yaml ApiCustomDomain + README "Custom domains"). This
  stack owns SiteBucket's bucket policy (the OAC grant); manage it here, not
  out of band. Deploy in us-east-1 (CloudFront's ACM cert region requirement).

Parameters:
  DomainName:
    Type: String
    Description: The apex (or any) domain the SPA is served at, e.g. schuit.io.
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone ID that owns DomainName.
  SiteBucket:
    Type: String
    Default: schuit-sharing
    Description: Name of the *existing* S3 bucket that will host the SPA. Bucket must already exist.
  SitePrefix:
    Type: String
    Default: web
    Description: S3 key prefix under SiteBucket where the SPA lives. No leading or trailing slash.
  SiteBucketRegion:
    Type: String
    Default: us-east-1
    Description: Region where SiteBucket lives. Needed to build the correct S3 regional origin DNS name.

Resources:
  # ---------- TLS certificate ----------
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ---------- CloudFront distribution ----------
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases: [!Ref DomainName]
        DefaultRootObject: index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          # SPA origin: existing shared bucket, scoped to /<SitePrefix> via OriginPath.
          - Id: s3-site
            DomainName: !Sub "${SiteBucket}.s3.${SiteBucketRegion}.amazonaws.com"
            OriginPath: !Sub "/${SitePrefix}"
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        # No global CustomErrorResponses. SPA fallback is handled in the
        # CloudFront Function below (only for non-asset paths), so a missing
        # /assets/foo.js correctly returns 404 instead of being silently
        # rewritten to index.html (which causes the browser to parse HTML as
        # JS and the app to fail to boot).

  # CloudFront Function (viewer-request): SPA fallback -- any request that has
  # no file extension (e.g. /admin, /browse/roms) is rewritten to /index.html
  # so React Router can handle it. Requests for files (anything containing a
  # "." in the last path segment, like /assets/index-abc.js or /favicon.ico)
  # pass through untouched, so a real missing asset surfaces as 404.
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for SPA routes
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          var uri = req.uri;

          var lastSlash = uri.lastIndexOf('/');
          var lastSegment = uri.substring(lastSlash + 1);
          if (lastSegment.indexOf('.') === -1) {
            req.uri = '/index.html';
          }

          return req;
        }

  # ---------- Bucket policy (OAC) ----------
  # Scoped to just the /<SitePrefix>/* objects, so the distribution cannot
  # serve anything outside the SPA's prefix even if it's asked to.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACReadSPA
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${SiteBucket}/${SitePrefix}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ---------- DNS ----------
  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${DomainName}."
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's fixed hosted zone ID

Outputs:
  SiteBucketName:
    Value: !Ref SiteBucket
    Description: Existing S3 bucket that hosts the SPA.
  SitePrefix:
    Value: !Ref SitePrefix
    Description: Key prefix under SiteBucket where the SPA lives. Sync dist/ to s3://<SiteBucket>/<SitePrefix>/.
  SiteUploadPath:
    Value: !Sub "s3://${SiteBucket}/${SitePrefix}/"
    Description: Full S3 URI for `aws s3 sync dist/` target.
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  Url:
    Value: !Sub "https://${DomainName}"
