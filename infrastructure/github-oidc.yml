AWSTemplateFormatVersion: "2010-09-09"
Description: >
  IAM deploy role for GitHub Actions CD of schuit-sharing. Assumes the account's
  EXISTING GitHub OIDC provider (token.actions.githubusercontent.com) — this
  template does not create the provider. Trust is scoped to one repo + branch.

Parameters:
  GitHubRepo:
    Type: String
    Default: SturgeonTechnologies/BackFriend_FullStack
    Description: >
      Informational only (shown in the role's tags) -- NOT what the trust
      policy actually matches on. See RepositoryId.
  RepositoryId:
    Type: String
    Default: "1219631445"
    Description: >
      The repo's immutable numeric ID (GitHub OIDC token claim
      `repository_id`; find it via `gh api repos/<owner>/<repo> --jq .id`).
      GitHub's `sub` claim switches to an `owner@ownerId/repo@repoId` format
      after a repo rename (discovered the hard way -- see TODO.md), so a
      trust policy matching on the plain "owner/repo" name breaks the first
      time either gets renamed. This + RepositoryOwnerId are used instead,
      via a wildcarded `sub` pattern (AWS requires a `sub` or
      `job_workflow_ref` condition present -- a bare repository_id condition
      alone is rejected) -- names can change again in the future without
      breaking this.
  RepositoryOwnerId:
    Type: String
    Default: "70855998"
    Description: The org's immutable numeric ID (GitHub OIDC token claim `repository_owner_id`).
  GitHubBranch:
    Type: String
    Default: main
  OidcProviderArn:
    Type: String
    Default: arn:aws:iam::587449585882:oidc-provider/token.actions.githubusercontent.com
  SharesBucket:
    Type: String
    Default: schuit-sharing
  ArtifactBucket:
    Type: String
    Default: schuit-sharing-artifacts-587449585882
    Description: >
      SAM's --s3-bucket target (deploy.config.<name>.json's artifactBucket).
      Separate from SharesBucket on purpose -- this permission set predates
      the SAM migration and was still scoped to the old Serverless
      Framework's *-serverlessdeploymentbucket-* convention, which SAM never
      uses (discovered when CI's first real post-migration deploy failed
      with AccessDenied on PutObject).
  DistributionId:
    Type: String
    Default: E26FQPCAP5752P
  ResourcePrefix:
    Type: String
    Default: schuit-sharing
    Description: >
      Prefix for this deployment's DynamoDB tables and the SSM parameter
      path (those genuinely follow "<ResourcePrefix>-<Stage>-*"). Must match
      the resourcePrefix used in your deploy.config.json.
  SamStackName:
    Type: String
    Default: schuit-sharing-sam
    Description: >
      deploy.config.<name>.json's stackName AND functionNamePrefix (the SAM
      migration made these independent of ResourcePrefix/Stage -- they're
      the same literal value in every config in this repo, not derived from
      "<ResourcePrefix>-<Stage>" like the pre-SAM Serverless Framework
      convention this template originally assumed). Used for the
      CloudFormation stack, Lambda functions, and their log groups.
  Stage:
    Type: String
    Default: prod
    Description: >
      Deployment stage suffix (combined with ResourcePrefix as
      "<ResourcePrefix>-<Stage>"). Must match the stage used in your
      deploy.config.json.
  RoleName:
    Type: String
    Default: ""
    Description: >
      Name for the deploy IAM role. Leave blank to default to
      "<ResourcePrefix>-gha-deploy".

Conditions:
  UseDefaultRoleName: !Equals [!Ref RoleName, ""]

Resources:
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If [UseDefaultRoleName, !Sub "${ResourcePrefix}-gha-deploy", !Ref RoleName]
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref OidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:repository_id: !Ref RepositoryId
                token.actions.githubusercontent.com:ref: !Sub "refs/heads/${GitHubBranch}"
              # AWS requires a sub/job_workflow_ref condition present (a bare
              # repository_id condition is rejected as "not scoped to all")
              # -- wildcard the org/repo NAMES, pin only the immutable IDs
              # embedded in them, so this keeps working through future renames.
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:*@${RepositoryOwnerId}/*@${RepositoryId}:ref:refs/heads/${GitHubBranch}"
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # --- CloudFormation: the serverless stack + template validation ---
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                Resource:
                  - !Sub "arn:aws:cloudformation:us-east-1:${AWS::AccountId}:stack/${SamStackName}/*"
              - Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:ListStacks
                Resource: "*"
              # SAM templates (Transform: AWS::Serverless-2016-10-31) need this
              # separately -- creating a changeset that invokes the transform
              # macro requires permission on the macro's own ARN, distinct from
              # (and in addition to) permission on the target stack.
              - Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: "arn:aws:cloudformation:us-east-1:aws:transform/Serverless-2016-10-31"

              # --- Lambda: this service's functions (+ a couple of read-only account calls) ---
              - Effect: Allow
                Action: lambda:*
                Resource: !Sub "arn:aws:lambda:us-east-1:${AWS::AccountId}:function:${SamStackName}-*"
              - Effect: Allow
                Action:
                  - lambda:GetAccountSettings
                  - lambda:ListFunctions
                Resource: "*"

              # --- API Gateway + Cognito: hard to resource-scope (IDs are created at deploy).
              #     NOTE: these are broad; tighten to the pool/API ARNs after first deploy. ---
              - Effect: Allow
                Action:
                  - apigateway:*
                  - cognito-idp:*
                Resource: "*"

              # --- DynamoDB tables for this stack ---
              - Effect: Allow
                Action: dynamodb:*
                Resource:
                  - !Sub "arn:aws:dynamodb:us-east-1:${AWS::AccountId}:table/${ResourcePrefix}-${Stage}-*"
                  - !Sub "arn:aws:dynamodb:us-east-1:${AWS::AccountId}:table/${ResourcePrefix}-${Stage}-*/index/*"

              # --- Log groups for this stack's Lambdas ---
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                Resource: !Sub "arn:aws:logs:us-east-1:${AWS::AccountId}:log-group:/aws/lambda/${SamStackName}-*"

              # --- IAM: only the roles serverless manages for this service, + pass to Lambda ---
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ResourcePrefix}-*"

              # --- SSM: Google OAuth creds, read at deploy time ---
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub "arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/${ResourcePrefix}/*"

              # --- S3: the serverless deployment bucket (create + artifacts) ---
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:PutBucketPolicy
                  - s3:GetBucketPolicy
                  - s3:PutBucketVersioning
                  - s3:PutEncryptionConfiguration
                  - s3:GetEncryptionConfiguration
                  - s3:PutBucketAcl
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub "arn:aws:s3:::${ResourcePrefix}-${Stage}-serverlessdeploymentbucket-*"
                  - !Sub "arn:aws:s3:::${ResourcePrefix}-${Stage}-serverlessdeploymentbucket-*/*"

              # --- S3: SAM's artifact bucket (sam deploy --s3-bucket target) ---
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub "arn:aws:s3:::${ArtifactBucket}"
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ArtifactBucket}/*"

              # --- S3: SPA sync target — only the web/ prefix of the shares bucket ---
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub "arn:aws:s3:::${SharesBucket}"
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub "arn:aws:s3:::${SharesBucket}/web/*"

              # --- CloudFront: invalidate the distribution after the SPA sync ---
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}"

Outputs:
  DeployRoleArn:
    Description: Put this in the workflow's role-to-assume (already hardcoded if you kept the default name).
    Value: !GetAtt DeployRole.Arn
