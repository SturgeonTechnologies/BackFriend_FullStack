AWSTemplateFormatVersion: "2010-09-09"
# Long-form notes are in YAML comments below (not subject to CFN's 1024-char
# Description limit) and in ../README.md "4b. Deploy the SES email stack".
#
# Coexistence with Google Workspace on schuit.io:
#   - DKIM uses unique SES selector subdomains; doesn't collide with
#     google._domainkey.schuit.io.
#   - Custom MAIL FROM lives on mail.schuit.io (subdomain) with its own
#     MX + SPF; root MX/SPF (Google) is left alone.
#   - From: header is still noreply@schuit.io and is DKIM-signed by the
#     apex identity, so DMARC alignment passes.
#
# Operational order:
#   1. Deploy. SES creates the identity in Pending state and CFN creates
#      the matching DKIM CNAMEs + MAIL FROM MX/SPF.
#   2. Wait 5–60 min for SES to detect the records and flip to Verified.
#   3. SES sandbox: new accounts can only send to verified recipients.
#      Verify your test recipient or request production access in the
#      SES console once DKIM is green.
#   4. Region: deploy in us-east-1 (matches the Lambda region; SES is
#      regional and identities don't replicate).
Description: SES domain identity for invite emails from noreply@schuit.io. Provisions an SES identity with EasyDKIM (3 CNAMEs) and a custom MAIL FROM on mail.schuit.io so the apex MX/SPF stays untouched for Google Workspace coexistence. DKIM verifies asynchronously (5–60 min). Deploy in us-east-1.

Parameters:
  Domain:
    Type: String
    Default: schuit.io
    Description: "Root domain to register as the SES sending identity. Must match the From: address domain (noreply@${Domain})."
  MailFromSubdomain:
    Type: String
    Default: mail
    Description: Subdomain label used for the SES custom MAIL FROM. Final FQDN = ${MailFromSubdomain}.${Domain}. Must NOT collide with anything Workspace uses.
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone ID for ${Domain}.
  Region:
    Type: String
    Default: us-east-1
    Description: Region whose SES endpoint is being verified. The MAIL FROM MX target depends on this (feedback-smtp.<region>.amazonses.com).

Resources:
  # ---------- SES domain identity with EasyDKIM + custom MAIL FROM ----------
  EmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref Domain
      DkimAttributes:
        SigningEnabled: true
      DkimSigningAttributes:
        NextSigningKeyLength: RSA_2048_BIT
      MailFromAttributes:
        MailFromDomain: !Sub "${MailFromSubdomain}.${Domain}"
        # If MAIL FROM DNS is misconfigured, SES will REJECT the send rather
        # than silently fall back to amazonses.com — that's the safe default
        # since silent fallback breaks DMARC alignment.
        BehaviorOnMxFailure: REJECT_MESSAGE
      FeedbackAttributes:
        EmailForwardingEnabled: true

  # ---------- DKIM CNAMEs (3) ----------
  # SES exposes the three DKIM records as DkimDNSTokenName1..3 /
  # DkimDNSTokenValue1..3 attributes on the EmailIdentity. Each Name is the
  # full hostname (e.g. abcd1234._domainkey.schuit.io) and each Value is the
  # CNAME target (e.g. abcd1234.dkim.amazonses.com).
  DkimRecord1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${EmailIdentity.DkimDNSTokenName1}."
      Type: CNAME
      TTL: "1800"
      ResourceRecords:
        - !GetAtt EmailIdentity.DkimDNSTokenValue1

  DkimRecord2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${EmailIdentity.DkimDNSTokenName2}."
      Type: CNAME
      TTL: "1800"
      ResourceRecords:
        - !GetAtt EmailIdentity.DkimDNSTokenValue2

  DkimRecord3:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${EmailIdentity.DkimDNSTokenName3}."
      Type: CNAME
      TTL: "1800"
      ResourceRecords:
        - !GetAtt EmailIdentity.DkimDNSTokenValue3

  # ---------- Custom MAIL FROM (mail.schuit.io) ----------
  # MX: SES bounce/complaint receiver for the configured region.
  MailFromMx:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${MailFromSubdomain}.${Domain}."
      Type: MX
      TTL: "1800"
      ResourceRecords:
        - !Sub "10 feedback-smtp.${Region}.amazonses.com"

  # SPF for the MAIL FROM subdomain only. We deliberately do NOT touch the
  # apex SPF record (which Google Workspace owns). DMARC alignment uses the
  # DKIM identity at the apex (signed by SES via the EasyDKIM keys), so
  # this MAIL-FROM SPF only needs to pass on its own subdomain.
  MailFromSpf:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${MailFromSubdomain}.${Domain}."
      Type: TXT
      TTL: "1800"
      ResourceRecords:
        - '"v=spf1 include:amazonses.com ~all"'

Outputs:
  # NOTE: AWS::SES::EmailIdentity does NOT expose an `Arn` GetAtt attribute
  # (only DkimDNSTokenName1/2/3 and DkimDNSTokenValue1/2/3 — see CFN docs).
  # We construct the identity ARN with !Sub instead. The format is
  # arn:aws:ses:<region>:<account>:identity/<domain>.
  IdentityArn:
    Value: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${Domain}"
    Description: ARN of the SES email identity. Reference this in IAM ses:SendEmail Resource conditions if you want to scope tightly.
  IdentityName:
    Value: !Ref Domain
    Description: SES identity name (the verified domain).
  MailFromDomain:
    Value: !Sub "${MailFromSubdomain}.${Domain}"
    Description: "Custom MAIL FROM domain. Lambdas should set MAIL_FROM=noreply@${Domain} (the visible From:), not this subdomain."
  FromAddress:
    Value: !Sub "noreply@${Domain}"
    Description: "Suggested From: address for outbound mail (matches the verified identity)."
  Region:
    Value: !Ref Region
    Description: SES region this identity was created in. Backend MAIL_REGION env var must match.
  SandboxNote:
    Value: "New SES accounts start in sandbox: only verified recipients work. Request production access in the SES console after DKIM verifies."
